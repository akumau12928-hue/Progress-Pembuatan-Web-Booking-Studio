<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - GOKILZZZ STUDIO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="navbar">
        <a href="dashboard.html" class="logo">GOKILZZZ STUDIO</a>
        <a href="dashboard.html" class="btn-outline">KEMBALI</a>
    </header>

    <div class="auth-container">
        <h2 class="auth-title">MASUK</h2>
        <form class="auth-form" id="loginForm">
            <div class="form-group">
                <label>USERNAME/ EMAIL</label>
                <input type="text" id="loginInput" required>
            </div>
            <div class="form-group">
                <label>PASSWORD</label>
                <input type="password" id="passwordInput" required>
            </div>
            <button type="submit" class="btn-submit">LOGIN</button>
        </form>
        <div class="auth-links">
            <p>LUPA PASSWORD? <a href="lupa password.html">KLIK DISINI</a></p>
            <p>BELUM PUNYA AKUN? <a href="register.html">DAFTAR</a></p>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
