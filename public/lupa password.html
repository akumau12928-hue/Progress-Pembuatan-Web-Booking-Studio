<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lupa Password - GOKILZZZ STUDIO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <!-- Library EmailJS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>
<body>
    <header class="navbar">
        <a href="dashboard.html" class="logo">GOKILZZZ STUDIO</a>
        <a href="login.html" class="btn-outline">KEMBALI</a>
    </header>

    <div class="auth-container">
        <h2 class="auth-title">LUPA PASSWORD</h2>

        <!-- Tahap 1: Submit Email -->
        <form class="auth-form" id="emailStepForm">
            <div class="form-group">
                <div class="label-row">
                    <label for="resetEmail">EMAIL</label>
                    <button type="button" id="changeEmailBtn" class="btn-change-email" style="display: none;">Ubah Email</button>
                </div>
                <input type="email" id="resetEmail" placeholder="Masukkan email terdaftar" required>
            </div>
            <button type="submit" class="btn-submit" id="sendOtpBtn">KIRIM KODE OTP</button>
        </form>

        <!-- Tahap 2: Input OTP + Kotak Timer 1 Menit + Submit Keseluruhan -->
        <form class="auth-form" id="otpForm" style="display: none; margin-top: 20px;">
            <div class="form-group">
                <label for="otpCode">KODE OTP</label>
                <div class="otp-input-row">
                    <input type="text" id="otpCode" maxlength="6" placeholder="6 digit kode OTP" required>
                    <button type="button" id="otpTimerBox" class="otp-timer-box" disabled>01:00</button>
                </div>
            </div>
            <button type="submit" class="btn-submit">RESET</button>
        </form>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
