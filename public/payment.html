<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pembayaran - GOKILZZZ STUDIO</title>
    <!-- Google Fonts: Cinzel, Montserrat, & Playfair Display -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    
    <!-- NAVBAR -->
    <header class="navbar">
        <a href="dashboard.html" class="logo">GOKILZZZ STUDIO</a>
        <a href="booking.html" class="btn-auth">KEMBALI</a>
    </header>

    <!-- ISI UTAMA PEMBAYARAN -->
    <main class="payment-wrapper">
        <h1 class="payment-title">Pembayaran</h1>

        <form id="paymentForm">
            <div class="form-group">
                <label for="namaPayment">NAMA LENGKAP</label>
                <input type="text" name="namaPayment" id="namaPayment" readonly placeholder="Nama Pelanggan">
            </div>

            <div class="form-group">
                <label for="whatsappPayment">NOMOR WHATSAPP</label>
                <input type="text" name="whatsappPayment" id="whatsappPayment" readonly placeholder="08xxxxxxxxxx">
            </div>

            <div class="form-group total-box">
                <div class="total-label">PAKET: <strong id="paketDipilihText" class="text-white">-</strong> (<span id="durasiDipilihText">-</span>)</div>
                <div class="total-price-wrapper">
                    <span>TOTAL PEMBAYARAN:</span>
                    <strong id="totalHargaText">Rp 0</strong>
                </div>
            </div>

            <div class="form-group qris-container">
                <label>QR PEMBAYARAN</label>
                <div class="qris-box">
                    <img src="images/qris.jpeg" alt="QR Code Pembayaran">
                </div>
            </div>

            <div class="form-group">
                <label for="namaPengirim">NAMA PEMILIK REKENING / E-WALLET PENGIRIM</label>
                <input type="text" name="namaPengirim" id="namaPengirim" required placeholder="Contoh: Budi Santoso (BCA / GoPay)">
            </div>

            <div class="form-group">
                <label for="buktiFile">BUKTI PEMBAYARAN</label>
                <div class="file-input-wrapper">
                    <input type="file" name="bukti" id="buktiFile" accept="image/*" required>
                    <div class="file-custom-btn" id="uploadBtnTrigger">
                        <span id="fileNameLabel">Tambahkan file...</span>
                        <span>📁</span>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-submit">SUBMIT PEMBAYARAN</button>
        </form>
    </main>

    <script src="js/payment.js"></script>
</body>
</html>
