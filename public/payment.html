<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pembayaran - GOKILZZZ STUDIO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    
    <!-- NAVBAR -->
    <header class="navbar">
        <div class="logo">GOKILZZZ STUDIO</div>
        <a href="index.html" class="btn-auth">KEMBALI</a>
    </header>

    <!-- ISI UTAMA PEMBAYARAN -->
    <main class="payment-wrapper">
        <h1 class="payment-title">Pembayaran</h1>

        <form id="paymentForm">
            <div class="form-group">
                <label for="namaPayment">NAMA LENGKAP</label>
                <input type="text" name="namaPayment" id="namaPayment" readonly placeholder="Nama Pelanggan">
            </div>

            <div class="form-group">
                <label for="whatsappPayment">NOMOR WHATSAPP</label>
                <input type="text" name="whatsappPayment" id="whatsappPayment" readonly placeholder="08xxxxxxxxxx">
            </div>

            <div class="form-group qris-container">
                <label>QR PEMBAYARAN</label>
                <div class="qris-box">
                    <img src="images/qris.jpeg" alt="QR Code Pembayaran">
                </div>
            </div>

            <div class="form-group">
                <label>BUKTI PEMBAYARAN</label>
                <div class="file-input-wrapper">
                    <input type="file" name="bukti" id="buktiFile" accept="image/*" required>
                    <div class="file-custom-btn" id="uploadBtnTrigger">
                        <span id="fileNameLabel">Tambahkan file...</span>
                        <span>📁</span>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-submit">SUBMIT PEMBAYARAN</button>
        </form>
    </main>

    <script src="js/payment.js"></script>
</body>
</html>
