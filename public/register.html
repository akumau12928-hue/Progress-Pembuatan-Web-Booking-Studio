<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - GOKILZZZ STUDIO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="navbar">
        <a href="dashboard.html" class="logo">GOKILZZZ STUDIO</a>
        <a href="dashboard.html" class="btn-outline">KEMBALI</a>
    </header>

    <div class="auth-container">
        <h2 class="auth-title">DAFTAR</h2>
        <form class="auth-form" id="registerForm">
            <div class="form-group">
                <label>USERNAME</label>
                <input type="text" id="regUsername" required>
            </div>
            <div class="form-group">
                <label>EMAIL</label>
                <input type="email" id="regEmail" required>
            </div>
            <div class="form-group">
                <label>PASSWORD</label>
                <input type="password" id="regPassword" required>
            </div>
            <div class="form-group">
                <label>ULANGI PASSWORD</label>
                <input type="password" id="regConfirmPassword" required>
            </div>
            <button type="submit" class="btn-submit">DAFTAR</button>
        </form>
        <div class="auth-links">
            <p>SUDAH PUNYA AKUN? <a href="login.html">MASUK</a></p>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
