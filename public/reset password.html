<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - GOKILZZZ STUDIO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="navbar">
        <a href="dashboard.html" class="logo">GOKILZZZ STUDIO</a>
        <a href="login.html" class="btn-outline">KEMBALI</a>
    </header>

    <div class="auth-container">
        <form class="auth-form" id="resetPasswordForm">
            <div class="form-group">
                <label>PASSWORD BARU</label>
                <div class="password-wrapper">
                    <input type="password" id="newPass" required>
                    <button type="button" class="toggle-password" data-target="newPass" title="Lihat/Sembunyikan Password">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="form-group">
                <label>ULANGI PASSWORD</label>
                <div class="password-wrapper">
                    <input type="password" id="confirmPass" required>
                    <button type="button" class="toggle-password" data-target="confirmPass" title="Lihat/Sembunyikan Password">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn-submit">KONFIRMASI</button>
        </form>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
